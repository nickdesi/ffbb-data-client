name: Publish to PyPI

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  verify:
    name: Verify Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.10"
            toxenv: py310
          - python: "3.11"
            toxenv: py311
          - python: "3.12"
            toxenv: py312
          - python: "3.13"
            toxenv: py313
          - python: "3.14"
            toxenv: py314
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v7
        id: setup-python
        with:
          python-version: ${{ matrix.python }}
          cache: 'pip'
      - name: Run test suite
        env:
          API_FFBB_APP_BEARER_TOKEN: ${{ secrets.API_FFBB_APP_BEARER_TOKEN }}
          MEILISEARCH_BEARER_TOKEN: ${{ secrets.MEILISEARCH_BEARER_TOKEN }}
        run: >-
          pipx run --python '${{ steps.setup-python.outputs.python-path }}'
          tox -e ${{ matrix.toxenv }}

  build:
    name: Build distribution
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Required for setuptools_scm to resolve version from tags

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install build dependencies
        run: pip install build

      - name: Build package
        run: python -m build

      - name: Verify packaged discovery artefacts
        run: |
          python - <<'PY'
          import json
          import zipfile
          from pathlib import Path

          wheels = list(Path('dist').glob('*.whl'))
          if len(wheels) != 1:
              raise SystemExit(f'Expected one wheel, found {len(wheels)}')

          required = {
              'ffbb_data_client/data/collections.json',
              'ffbb_data_client/data/endpoint_discovery.json',
              'ffbb_data_client/data/indexes.json',
              'ffbb_data_client/data/openapi.json',
          }
          with zipfile.ZipFile(wheels[0]) as wheel:
              names = set(wheel.namelist())
              missing = sorted(required - names)
              if missing:
                  raise SystemExit(f'Missing discovery artefacts in wheel: {missing}')
              with wheel.open('ffbb_data_client/data/endpoint_discovery.json') as handle:
                  json.load(handle)
          print('Discovery artefacts are present in the wheel.')
          PY

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

      - name: Generate artifact attestation
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763  # v4
        with:
          subject-path: dist/*

  publish-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # Required for OIDC Trusted Publisher

    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b  # release/v1

  publish-github-release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b  # v3
        with:
          files: dist/*
          generate_release_notes: true

  notify-mcp-server:
    name: Notify FFBB-MCP-Server
    needs: publish-pypi
    runs-on: ubuntu-latest

    steps:
      - name: Dispatch bump event to FFBB-MCP-Server
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697  # v4
        continue-on-error: true
        with:
          token: ${{ secrets.MCP_SERVER_PAT }}
          repository: nickdesi/FFBB-MCP-Server
          event-type: ffbb-client-released
          client-payload: '{"version": "${{ github.ref_name }}"}'
