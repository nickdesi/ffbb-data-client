name: Update FFBB API Discovery

on:
  schedule:
    # Refresh live FFBB API discovery every day at 05:17 UTC.
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-ffbb-api-discovery
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  update-discovery:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install package
        run: python -m pip install -e .

      - name: Refresh FFBB API discovery artefacts
        env:
          API_FFBB_APP_BEARER_TOKEN: ${{ secrets.API_FFBB_APP_BEARER_TOKEN }}
          MEILISEARCH_BEARER_TOKEN: ${{ secrets.MEILISEARCH_BEARER_TOKEN }}
        run: python scripts/discover_endpoints.py

      - name: Probe FFBB permission matrix
        continue-on-error: true
        env:
          API_FFBB_APP_BEARER_TOKEN: ${{ secrets.API_FFBB_APP_BEARER_TOKEN }}
        run: python scripts/discover_permissions.py

      - name: Detect permission drift
        id: permission
        run: |
          if [ -f data/permission_drift_summary.md ] && grep -q '^- FLIP' data/permission_drift_summary.md; then
            echo "pchanged=true" >> "$GITHUB_OUTPUT"
          else
            echo "pchanged=false" >> "$GITHUB_OUTPUT"
            echo "No permission drift detected; skipping permission PR."
          fi

      - name: Detect structural discovery changes
        id: changes
        run: |
          if grep -Eq '^- (Added|Removed): \[' data/api_update_summary.md || grep -q 'drift' data/api_update_summary.md; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No structural discovery changes detected; skipping PR."
          fi

      - name: Upload discovery summary
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ffbb-api-update-summary
          path: data/api_update_summary.md
          if-no-files-found: ignore
          retention-days: 14

      - name: Create pull request
        if: steps.changes.outputs.changed == 'true' || steps.permission.outputs.pchanged == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1  # v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: chore/update-ffbb-api-discovery
          delete-branch: true
          commit-message: 'chore: refresh FFBB API discovery artefacts'
          title: 'chore: refresh FFBB API discovery artefacts'
          body-path: data/api_update_summary.md
          labels: |
            automation
            ffbb-api
          add-paths: |
            data/endpoint_discovery.json
            data/collections.json
            data/indexes.json
            data/openapi.json
            data/openapi_full.json
            data/api_update_summary.md
            data/field_dictionary.json
            data/permission_matrix.json
            data/permission_drift_summary.md
            src/ffbb_data_client/data/__init__.py
            src/ffbb_data_client/data/collections.json
            src/ffbb_data_client/data/endpoint_discovery.json
            src/ffbb_data_client/data/indexes.json
            src/ffbb_data_client/data/openapi.json
            src/ffbb_data_client/data/field_dictionary.json
            src/ffbb_data_client/data/permission_matrix.json
            docs/data_dictionary.rst
            docs/index.rst
            README.md
